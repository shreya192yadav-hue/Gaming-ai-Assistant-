name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip project
        run: unzip -q project.zip -d proj
      - name: Build
        working-directory: proj
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > ../build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: " ../build.log | head -6 | sed 's/^/::error::/'
            grep -A4 "What went wrong" ../build.log | head -6 | sed 's/^/::error::/'
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: GameAICompanion-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
